name: climaa
description: Clima weather app built with Clean Architecture and Cubit.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  geolocator: ^14.0.2
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.8

  # state management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/icon99.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/icon99.png"