name: climaa
description: A new Flutter project.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  geolocator: ^13.0.1
  flutter_spinkit: ^5.2.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - images/

flutter_icons:
  android: true
  ios: true
  image_path: "images/icon99.png"
  adaptive_icon_background: "#ffffff"   # اللون الخلفي للأيقونة في أندرويد
  adaptive_icon_foreground: "images/icon99.png"
